# Run pre-built images instead of building from source.
#
# This file is self-contained — the VPS needs only this file and a .env, not a clone of
# the repository:
#
#   docker compose -f docker-compose.registry.yml up -d
#
# Both images are configured entirely at runtime (the frontend calls a relative /api and
# Caddy reads SITE_ADDRESS from the environment), so the same image serves any domain.
services:
  db:
    image: postgres:16-alpine
    # No container_name: it would be globally unique and stop this stack running
    # alongside another compose project on the same host.
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-mydb}
    expose:
      - "5432"
    command: >
      postgres
      -c max_connections=${POSTGRES_MAX_CONNECTIONS:-120}
      -c shared_buffers=${POSTGRES_SHARED_BUFFERS:-256MB}
    volumes:
      - mydb-studio-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-mydb}"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: ${DB_MEMORY_LIMIT:-1g}
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    image: ${IMAGE_PREFIX:?set IMAGE_PREFIX, e.g. docker.io/youruser/kernabase}-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      PGHOST: db
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-mydb}
      STUDIO_JWT_SECRET: ${STUDIO_JWT_SECRET:?set STUDIO_JWT_SECRET}
      STUDIO_SECRET: ${STUDIO_SECRET:?set STUDIO_SECRET}
      CORS_ORIGINS: ${PUBLIC_ORIGIN:?set PUBLIC_ORIGIN, e.g. https://studio.example.com}
      # Caddy is the single hop in front of this process; without this every visitor
      # shares one rate-limit bucket.
      TRUSTED_PROXY_HOPS: "1"
      # Off unless this studio is meant to reach databases on its own network.
      ALLOW_PRIVATE_DATABASE_HOSTS: ${ALLOW_PRIVATE_DATABASE_HOSTS:-false}
      TENANT_POOL_CONNECTION_BUDGET: ${TENANT_POOL_CONNECTION_BUDGET:-100}
      TENANT_STATEMENT_TIMEOUT_MS: ${TENANT_STATEMENT_TIMEOUT_MS:-15000}
    expose:
      - "3001"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3001/api/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: ${BACKEND_MEMORY_LIMIT:-512m}
    logging: *logging

  edge:
    image: ${IMAGE_PREFIX:?set IMAGE_PREFIX}-edge:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      # Bare domain for automatic HTTPS, or ":80" to test without TLS.
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS, e.g. studio.example.com}
      BACKEND_ORIGIN: backend:3001
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      # Certificates must survive restarts, or ACME re-runs and eventually rate-limits.
      - caddy-data:/data
      - caddy-config:/config
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/api/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: ${EDGE_MEMORY_LIMIT:-128m}
    logging: *logging

volumes:
  mydb-studio-data:
  caddy-data:
  caddy-config:
